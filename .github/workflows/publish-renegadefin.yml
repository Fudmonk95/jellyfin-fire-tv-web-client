name: Publish RenegadeFin preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-renegadefin.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified native build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Fudmonk95/jellyfin-fire-tv-web-client
        run: |
          test "$(gh run view 35278099124 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 35278099124 --json headSha --jq .headSha)" = 041e690f13634839204ef5ee9e38461de363387c
          gh run download 35278099124 --name renegadefin-preview --dir apk
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          apks = list(Path("apk").rglob("*.apk"))
          if len(apks) != 1:
              raise RuntimeError("Expected exactly one verified APK")
          shutil.copyfile(apks[0], "renegadefin-preview.apk")
          PY
          sha256sum renegadefin-preview.apk > SHA256SUMS.txt
          cat > notes.md <<'EOF'
          Home loading recovery and diagnostics preview.

          Each home row now loads independently and appears as soon as it is ready. A failing Next up, Continue watching or Recently added request no longer hides successful library rows. Refresh clears stale rows and retries. Failed rows distinguish HTTP 401/403, missing endpoints, server errors, timeouts, TLS failures and unreadable responses. New diagnostic log entries omit response bodies, URLs and tokens.

          Regression tests cover partial failure, slow rows, cancellation when leaving the screen and safe error messages. The existing profile policy tests also run.

          This does not establish or fix every cause of the reported post-login crash. The separate Android client crash report is still needed. No universal Jellyfin 12 or plugin compatibility claim; real Fire TV/server testing remains necessary.

          Install renegadefin-preview.apk with Downloader. This is a debug-signed preview; if Android rejects an update due to a signature mismatch, uninstall the old RenegadeFin preview and reinstall, then sign in again. Do not uninstall your Jellyfin server or official Jellyfin app.
          EOF
          gh release create v0.2.0-preview.2 renegadefin-preview.apk SHA256SUMS.txt --target 041e690f13634839204ef5ee9e38461de363387c --prerelease --title "RenegadeFin — home loading recovery preview" --notes-file notes.md
