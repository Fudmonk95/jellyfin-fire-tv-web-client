name: Import and build RenegadeFin
on:
  push:
    branches: [native-tv-rebuild]
    paths: ['native-bootstrap/**', '.github/workflows/native-bootstrap.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import pinned native source and apply RenegadeFin changes
        run: |
          cp native-bootstrap/renegadefin.patch "$RUNNER_TEMP/renegadefin.patch"
          cp native-bootstrap/renegadefin.yml "$RUNNER_TEMP/renegadefin.yml"
          git clone --depth 1 --branch v0.19.10 https://github.com/jellyfin/jellyfin-androidtv.git "$RUNNER_TEMP/native-source"
          test "$(git -C "$RUNNER_TEMP/native-source" rev-parse HEAD)" = 984181a3d6ab14e9a6d2dcc850c582e1c138bd95
          git -C "$RUNNER_TEMP/native-source" apply --check "$RUNNER_TEMP/renegadefin.patch"
          git -C "$RUNNER_TEMP/native-source" apply "$RUNNER_TEMP/renegadefin.patch"
          rm -rf "$RUNNER_TEMP/native-source/.git" "$RUNNER_TEMP/native-source/.github"
          git rm -r --ignore-unmatch .
          cp -a "$RUNNER_TEMP/native-source/." .
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/renegadefin.yml" .github/workflows/renegadefin.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Replace web wrapper with native RenegadeFin TV preview"
          git push origin HEAD:native-tv-rebuild
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Compile and package
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -Pjellyfin.version=0.2.0-preview.1 --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: renegadefin-preview
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
