name: Build Fire TV APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Check web navigation syntax
        run: node --check app/src/main/assets/native/TvNavigation.js
      - name: Build APK
        run: ./gradlew assembleLibreDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-web-tv-battery-focus-fix
          path: app/build/outputs/apk/libre/debug/*.apk
          if-no-files-found: error
