name: Restore complete Android source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import pinned upstream source
        run: |
          git remote add upstream https://github.com/jellyfin/jellyfin-android.git
          git fetch --depth=1 upstream 44a9a67a203a022546ebff7cb4963d4189a572db
          git archive FETCH_HEAD | tar -x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Restore complete Jellyfin Android source at 44a9a67"
          git push origin HEAD:main
